<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05060f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aura" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Aura" />
    
    <title>Aura — Christian Social Network & Sanctuary</title>
    <meta name="description" content="A sanctuary for the broken, healed by grace. Walk in the Light, connect with believers, intercede on the Prayer Wall, and study the Living Word." />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#38bdf8" />

    <meta property="og:title" content="Aura — Social, Live Calling & Matrix Protocol" />
    <meta property="og:description" content="Server-backed social feed, WebRTC video calling, encrypted private chats, and daily inspiration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        background-color: #05060f !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      #root {
        background-color: #05060f;
        min-height: 100%;
      }
    </style>
    <script>
      // Auto-recover from stale Service Worker / cached chunk 404s on mobile
      window.addEventListener("error", function(event) {
        var isScriptError = event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK');
        var msg = (event && event.message) || "";
        
        if (isScriptError || msg.includes("Loading chunk") || msg.includes("Unexpected token") || msg.includes("Failed to fetch dynamically imported module") || msg.includes("is not defined") || msg.includes("text/html")) {
          var hasReloaded = sessionStorage.getItem("aura_chunk_reload");
          if (!hasReloaded) {
            sessionStorage.setItem("aura_chunk_reload", "true");
            if ("serviceWorker" in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) {
                  regs[i].unregister();
                }
                // Also clear caches
                if ("caches" in window) {
                  caches.keys().then(function(names) {
                    Promise.all(names.map(name => caches.delete(name))).then(() => {
                      window.location.reload(true);
                    });
                  });
                } else {
                  window.location.reload(true);
                }
              });
            } else if ("caches" in window) {
              caches.keys().then(function(names) {
                for (var k = 0; k < names.length; k++) {
                  caches.delete(names[k]);
                }
                window.location.reload(true);
              });
            } else {
              window.location.reload(true);
            }
          }
        }
      }, true);
    </script>
  </head>
  <body style="background-color: #05060f; color: #f8fafc; margin: 0; padding: 0;">
    <div id="root" style="background-color: #05060f; min-height: 100vh;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
